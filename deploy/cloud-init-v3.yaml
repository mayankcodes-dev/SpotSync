#cloud-config
write_files:
  # Overwrite the iptables-persistent saved rules with fully open ruleset
  # netfilter-persistent.service loads this file - by making it open, SSH works
  - path: /etc/iptables/rules.v4
    permissions: '0644'
    content: |
      # Generated by cloud-init for OCI SpotSync deployment
      *filter
      :INPUT ACCEPT [0:0]
      :FORWARD ACCEPT [0:0]
      :OUTPUT ACCEPT [0:0]
      COMMIT
  - path: /etc/iptables/rules.v6
    permissions: '0644'
    content: |
      *filter
      :INPUT ACCEPT [0:0]
      :FORWARD ACCEPT [0:0]
      :OUTPUT ACCEPT [0:0]
      COMMIT